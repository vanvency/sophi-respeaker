<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting Listener</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Fraunces:opsz,wght@9..144,600&display=swap');
*{box-sizing:border-box}body{margin:0;background:#101713;color:#e8ede5;font:15px 'DM Mono',monospace;min-height:100vh;background-image:radial-gradient(#263a2c 1px,transparent 1px);background-size:18px 18px}.wrap{max-width:920px;margin:auto;padding:48px 22px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #49604e;padding-bottom:25px}h1{font:600 42px Fraunces,serif;margin:0;letter-spacing:-1px}.tag{color:#9ab49d;font-size:11px;letter-spacing:1px}button{border:1px solid #d6e364;background:#d6e364;color:#172019;padding:13px 20px;font:inherit;cursor:pointer}button.stop{background:transparent;color:#e8ede5;border-color:#6e8572}.panel{margin-top:32px;border:1px solid #49604e;background:#142019cc;padding:26px}.status{font-size:12px;color:#9ab49d}.dot{display:inline-block;width:9px;height:9px;border-radius:9px;background:#6e8572;margin-right:8px}.on{background:#ff7657;box-shadow:0 0 16px #ff7657}.line{padding:21px 0;border-bottom:1px solid #304534;display:grid;grid-template-columns:190px 1fr;gap:20px}.line time{color:#8ca38e;font-size:12px}.empty{color:#718675;padding:35px 0}#error{color:#ff9b83;margin-top:18px;white-space:pre-wrap}.foot{color:#718675;font-size:11px;margin-top:30px}</style></head><body><main class="wrap"><header><div><div class="tag">PI-185 / RESPEAKER 6-MIC / LOCAL WHISPER</div><h1>Meeting Listener</h1></div><button id="toggle">Start listening</button></header><section class="panel"><div class="status"><span id="dot" class="dot"></span><span id="status">idle — {{ chunk_seconds }} second capture windows</span></div><div id="lines"><div class="empty">No transcript yet.</div></div><div id="error"></div></section><div class="foot">Raw 8-channel WAV chunks are retained on the Pi for direction, denoising, and speaker-ID processing.</div></main><script>
const b=document.querySelector('#toggle'),d=document.querySelector('#dot'),s=document.querySelector('#status'),l=document.querySelector('#lines'),e=document.querySelector('#error');let last='';
async function poll(){let x=await fetch('/api/state').then(r=>r.json());b.textContent=x.running?'Stop listening':'Start listening';b.className=x.running?'stop':'';d.className='dot '+(x.running?'on':'');s.textContent=x.running?'capturing and transcribing…':'idle — {{ chunk_seconds }} second capture windows';e.textContent=x.error||'';let html=x.lines.slice().reverse().map(v=>`<div class="line"><time>${v.time}</time><div>${v.text}</div></div>`).join('');l.innerHTML=html||'<div class="empty">No transcript yet.</div>'}
b.onclick=async()=>{let x=await fetch('/api/state').then(r=>r.json());await fetch(x.running?'/api/stop':'/api/start',{method:'POST'});poll()};poll();setInterval(poll,1000);
</script></body></html>
